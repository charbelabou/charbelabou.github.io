<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kezbe Bayda and Massela</title>
  <meta name="description" content="Two Lebanese party games by Charbel Abou Khalil. Kezbe Bayda, the game show of lies, and Massela, Lebanese charades.">
  <meta name="theme-color" content="#5e0d1b">
  <link rel="canonical" href="https://charbelabou.github.io/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Kezbe Bayda and Massela">
  <meta property="og:description" content="Two Lebanese party games by Charbel Abou Khalil.">
  <meta property="og:url" content="https://charbelabou.github.io/">
  <meta property="og:image" content="https://charbelabou.github.io/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <link rel="preload" href="fonts/bowlby-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/titan-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face { font-family: "Bowlby One"; src: url("fonts/bowlby-one.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Titan One"; src: url("fonts/titan-one.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "DM Sans"; src: url("fonts/dm-sans.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }

    :root {
      /* Kezbe Bayda */
      --kb-ray-a: #7c1428;
      --kb-ray-b: #5e0d1b;
      --kb-deep: #2a0710;
      --kb-gold: #ffc83d;
      --kb-cream: #fff1d6;
      /* Massela (red darkened a touch from #ea3025 so white text passes contrast) */
      --ms-red: #df2b21;
      --ms-navy: #0e2b3f;

      --text: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--ms-red);
      font-family: var(--text);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, p { margin: 0; }
    img { display: block; }
    a { color: inherit; }

    main { display: grid; }

    .game {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 56px 24px 20px;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }
    .game > * { position: relative; }

    .icon { width: 96px; height: 96px; border-radius: 22px; }

    h2 { font-weight: 400; line-height: 1; margin-top: 26px; }

    .line { margin-top: 16px; font-size: 19px; font-weight: 700; line-height: 1.3; }
    .how { margin-top: 4px; font-size: 17px; line-height: 1.4; max-width: 30ch; text-wrap: balance; }

    .stores {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 12px; margin-top: 30px;
    }
    .stores a { display: block; border-radius: 9px; transition: transform .12s ease; }
    .stores a:active { transform: translateY(1px); }
    .stores img { height: 48px; width: auto; }
    .soon { margin-top: 12px; font-size: 15px; }

    .links { display: flex; gap: 24px; margin-top: 36px; font-size: 15px; }
    .links a {
      display: inline-flex; align-items: center; min-height: 44px;
      text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px;
      text-decoration-color: currentColor;
    }

    /* ---------- Kezbe Bayda: the show's sunburst, gold title with a hard shadow ---------- */
    .kb { background: var(--kb-ray-b); color: var(--kb-cream); padding-top: max(20px, env(safe-area-inset-top)); }
    .kb::before {
      content: ""; position: absolute; left: 50%; top: 210px;
      width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px;
      background: repeating-conic-gradient(var(--kb-ray-a) 0 5deg, var(--kb-ray-b) 5deg 10deg);
    }
    .kb::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(120% 80% at 50% 210px, transparent 30%, rgba(26, 3, 9, .7) 100%);
    }
    .kb .icon { box-shadow: 0 0 0 3px var(--kb-cream), 0 7px 0 3px var(--kb-deep); }
    .kb h2 {
      font-family: "Bowlby One", var(--text);
      font-size: clamp(30px, 10.2vw, 64px);
      letter-spacing: .01em;
      color: var(--kb-gold);
      text-shadow: 0 5px 0 var(--kb-deep);
    }
    .kb a:focus-visible { outline: 3px solid var(--kb-gold); outline-offset: 3px; }

    .owner {
      align-self: stretch; text-align: left;
      margin-bottom: 36px;
      font-size: 15px; font-weight: 700; color: var(--kb-cream);
    }

    /* ---------- Massela: red with white dots, white title with a navy outline ---------- */
    .ms { background: var(--ms-red); color: #fff; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    .ms::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(rgba(255, 255, 255, .16) 2.2px, transparent 2.8px) 0 0 / 20px 20px;
    }
    .ms .icon { box-shadow: 0 0 0 3px var(--ms-navy), 0 7px 0 3px var(--ms-navy); }
    .ms h2 {
      font-family: "Titan One", var(--text);
      font-size: clamp(44px, 14vw, 72px);
      letter-spacing: .01em;
      color: #fff;
      text-shadow:
        -3px -3px 0 var(--ms-navy), 3px -3px 0 var(--ms-navy), -3px 3px 0 var(--ms-navy), 3px 3px 0 var(--ms-navy),
        0 -3px 0 var(--ms-navy), 0 3px 0 var(--ms-navy), -3px 0 0 var(--ms-navy), 3px 0 0 var(--ms-navy),
        0 7px 0 var(--ms-navy);
    }
    .ms a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    /* ---------- Wide screens: the two games side by side ---------- */
    @media (min-width: 900px) {
      main { grid-template-columns: 1fr 1fr; min-height: 100vh; }
      .game { padding: max(96px, 22vh) 40px 96px; }
      .owner { position: absolute; top: 32px; left: 40px; margin: 0; }
      .links { position: absolute; bottom: 24px; margin: 0; }
      .icon { width: 112px; height: 112px; border-radius: 26px; }
      .kb::before, .kb::after { top: 0; }
      .kb::before { top: 42%; }
      .kb::after { background: radial-gradient(110% 80% at 50% 42%, transparent 30%, rgba(26, 3, 9, .7) 100%); }
      .kb h2 { font-size: clamp(52px, 5.4vw, 76px); }
      .ms h2 { font-size: clamp(60px, 6.4vw, 88px); }
      .line { font-size: 21px; }
      .how { font-size: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stores a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="game kb" aria-labelledby="kb">
      <h1 class="owner">Charbel Abou Khalil</h1>
      <img class="icon" src="img/kezbe-bayda.png" width="96" height="96" alt="Kezbe Bayda app icon">
      <h2 id="kb">Kezbe Bayda</h2>
      <p class="line">The game show of lies.</p>
      <p class="how">Write a fake answer, then find the real one.</p>
      <div class="stores">
        <a href="https://apps.apple.com/app/id6816085585"><img src="img/app-store.svg" width="144" height="48" alt="Download Kezbe Bayda on the App Store"></a>
        <a href="https://play.google.com/store/apps/details?id=com.kezbebayda.app"><img src="img/google-play.png" width="161" height="48" alt="Get Kezbe Bayda on Google Play"></a>
      </div>
      <p class="links">
        <a href="https://charbelabou.github.io/legal/kezbe-bayda/support.html">Support</a>
        <a href="https://charbelabou.github.io/legal/kezbe-bayda/privacy.html">Privacy</a>
      </p>
    </section>

    <section class="game ms" aria-labelledby="ms">
      <img class="icon" src="img/massela.png" width="96" height="96" alt="Massela app icon">
      <h2 id="ms">Massela</h2>
      <p class="line">Lebanese charades.</p>
      <p class="how">Act out the word before the time runs out.</p>
      <div class="stores">
        <a href="https://apps.apple.com/app/id6757847836"><img src="img/app-store.svg" width="144" height="48" alt="Download Massela on the App Store"></a>
      </div>
      <p class="soon">Android version coming soon.</p>
      <p class="links">
        <a href="https://charbelabou.github.io/legal/massela/support.html">Support</a>
        <a href="https://charbelabou.github.io/legal/massela/privacy.html">Privacy</a>
      </p>
    </section>
  </main>
</body>
</html>
